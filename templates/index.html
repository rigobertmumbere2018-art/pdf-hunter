<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Hunter</title>

<style>
:root {
    --blue: #1463ff;
    --dark: #111827;
    --gray: #6b7280;
    --light: #f3f5f8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--light);
    color: var(--dark);
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 25px 16px 50px;
}

header {
    text-align: center;
    padding: 35px 10px 25px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 65px;
    height: 65px;
    background: var(--blue);
    border-radius: 18px;
    font-size: 32px;
}

h1 {
    margin: 15px 0 8px;
    font-size: 32px;
}

.subtitle {
    color: var(--gray);
    line-height: 1.5;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 9px;
}

.row {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #d9dee7;
    border-radius: 12px;
    font-size: 16px;
}

button {
    border: 0;
    background: var(--blue);
    color: white;
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 700;
}

.note {
    font-size: 13px;
    color: var(--gray);
    margin-top: 13px;
}

.status {
    margin: 22px 0;
    text-align: center;
    color: var(--gray);
}

.results {
    margin-top: 20px;
    display: none;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.pdf {
    background: white;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.pdf input {
    flex: none;
    width: 20px;
    height: 20px;
}

.icon {
    font-size: 25px;
}

.info {
    flex: 1;
    min-width: 0;
}

.name {
    font-weight: 700;
}

.url {
    color: var(--gray);
    font-size: 12px;
    margin-top: 4px;
    word-break: break-all;
}

.open {
    color: var(--blue);
    text-decoration: none;
    font-weight: 700;
}

footer {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: var(--gray);
}

@media(max-width:600px) {
    .row {
        flex-direction: column;
    }

    .row button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
<div class="logo">📚</div>
<h1>PDF Hunter</h1>
<div class="subtitle">
Détectez les fichiers PDF publiquement accessibles sur une page web.
</div>
</header>

<div class="card">

<label for="url">
Lien de la page à analyser
</label>

<div class="row">

<input
id="url"
type="url"
placeholder="https://exemple.com/page-des-livres"
>

<button onclick="scan()">
🔍 Analyser
</button>

</div>

<p class="note">
L'outil recherche les liens PDF directement présents sur la page.
</p>

</div>

<div id="status" class="status"></div>

<div id="results" class="results">

<div class="topbar">
<strong id="count"></strong>
</div>

<div id="list"></div>

</div>

<footer>
PDF Hunter • Analyse de liens publics
</footer>

</div>

<script>

async function scan() {

const url = document.getElementById('url').value.trim();

const status = document.getElementById('status');

const results = document.getElementById('results');

if (!url) {
status.textContent = "Veuillez coller un lien.";
return;
}

status.textContent = "Analyse de la page en cours...";

results.style.display = "none";

try {

const response = await fetch('/scan', {

method: 'POST',

headers: {
'Content-Type': 'application/json'
},

body: JSON.stringify({
url: url
})

});

const data = await response.json();

if (!response.ok) {
throw new Error(data.error);
}

const pdfs = data.pdfs || [];

document.getElementById('count').textContent =
pdfs.length + " PDF trouvé(s)";

const list = document.getElementById('list');

list.innerHTML = "";

pdfs.forEach(function(pdf) {

const div = document.createElement('div');

div.className = "pdf";

div.innerHTML = `
<div class="icon">📄</div>

<div class="info">

<div class="name">${pdf.name}</div>

<div class="url">${pdf.url}</div>

</div>

<a class="open"
href="${pdf.url}"
target="_blank">

Ouvrir

</a>
`;

list.appendChild(div);

});

if (pdfs.length === 0) {

status.textContent =
"Aucun lien PDF trouvé sur cette page.";

} else {

status.textContent = "";

results.style.display = "block";

}

}

catch(error) {

status.textContent =
"Erreur : " + error.message;

}

}

</script>

</body>
</html>
